<!doctype html>
<!--
	lang is "en" only as the pre-hydration default, because static HTML cannot read the
	saved locale. `src/lib/locale.ts` sets `document.documentElement.lang` from the locale
	in force as soon as the app boots, which is what a screen reader uses to choose
	pronunciation. The manifest's lang cannot be dynamic at all — see `vite.config.ts`.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!--
			The page title and description are deliberately NOT set here.
			Every route sets its own in svelte:head, and a static one in this file would be a
			second title element in the document. The browser uses the first, so a page would
			load showing the generic one and then visibly swap to the route's own on
			hydration. e2e/app.spec.ts asserts every route provides one.

			The Open Graph tags below stay static: routes do not set them, so there is
			nothing to duplicate, and they describe the site rather than the page. The app
			routes render only a loading shell before the local database opens, so these are
			what a crawler or a link preview actually reads.
		-->
		<link rel="canonical" href="https://graftful.app/" />
		<meta name="theme-color" content="#1f6f4a" />
		<meta name="color-scheme" content="light" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Graftful" />
		<meta property="og:title" content="Graftful — medication tracking for transplant recipients" />
		<meta
			property="og:description"
			content="Know what to take, how much is left, and when to reorder. Free, no account, works offline."
		/>
		<meta property="og:url" content="https://graftful.app/" />
		<meta property="og:image" content="https://graftful.app/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Graftful" />
		<meta property="og:locale" content="en" />
		<meta name="twitter:card" content="summary_large_image" />

		<!--
			iOS ignores the manifest icons for the home screen and uses this one, which
			must be opaque or it renders on black.
		-->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!--
			SVG first, so the tab icon is drawn at whatever size the browser wants rather than
			upscaled from a raster. The PNG stays as a fallback for browsers that ignore it. The
			tile artwork is used rather than the bare mark, because a filled tile keeps its
			contrast on a dark tab strip where a thin green stroke would disappear.
		-->
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
		<!--
			Browsers request /favicon.ico unconditionally, whatever the links above say, so
			without this file every visit logs a 404. It is also what bookmark lists and some
			feed readers use.
		-->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />

		<!--
			Both, on purpose. `mobile-web-app-capable` is the standardised name and the one
			current browsers want; Chrome logs a deprecation warning without it. The `apple-`
			prefixed version is still what older iOS reads, and iOS is where installing to
			the home screen matters most — it is the only way to get the app off a browser
			tab there, since Safari has no install prompt. Dropping it to silence the warning
			would trade a console message for a worse install on the platform that needs it.
		-->
		<meta name="mobile-web-app-capable" content="yes" />
		<!--
			iOS launch images. Generated by `npm run icons` from the device list in
			scripts/generate-icons.mjs — edit that list, not this block, or the images and the
			media queries will drift apart.
		-->
		<!-- ios-splash:start -->
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-pro-12-portrait.png"
			media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-pro-12-landscape.png"
			media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-pro-11-portrait.png"
			media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-pro-11-landscape.png"
			media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-air-portrait.png"
			media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-air-landscape.png"
			media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-portrait.png"
			media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-ipad-landscape.png"
			media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-16-pro-max-portrait.png"
			media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-15-pro-max-portrait.png"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-14-plus-portrait.png"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-16-pro-portrait.png"
			media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-15-portrait.png"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-14-portrait.png"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-x-portrait.png"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/icons/splash/splash-iphone-se-portrait.png"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<!-- ios-splash:end -->

		<!--
			The manifest, linked by hand.

			`@vite-pwa/sveltekit` generates `manifest.webmanifest` but does not get its <link>
			into SvelteKit's prerendered HTML — the same gap that stopped `injectRegister`
			working for the service worker. Without this line the file is generated, precached
			and served, and the app still cannot be installed: no icon, no standalone window,
			no home screen. Nothing warns you, and every page otherwise looks correct.

			e2e/app.spec.ts asserts the link exists and that the manifest it points at parses
			with the fields an install prompt requires.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Graftful" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
